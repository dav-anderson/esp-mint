[package]
name = "esp-mint"
version = "0.11.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"

[dependencies]
# mint-core is pinned to its release tag.
mint-core = { git = "https://github.com/dav-anderson/mint-core.git", tag = "v0.3.0" }
mint-types = { git = "https://github.com/dav-anderson/mint-core.git", tag = "v0.3.0" }
bdhke = { git = "https://github.com/dav-anderson/mint-core.git", tag = "v0.3.0" }
# The wire types, shared with the other mints and the wallet.
# `seal` and `air-client` are for the AIR listener (the mint's own DID key, the
# requests it opens and the replies it signs); see the README, "The AIR listener".
sp-wire = { git = "https://github.com/dav-anderson/sp-wire.git", tag = "v0.7.0", features = ["seal", "air-client"] }
secp256k1 = { version = "0.30", default-features = false, features = ["global-context", "rand", "serde"] }
sha2 = "0.10"
hex = "0.4.3"
rand = "0.8.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
axum = "0.8"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal", "time", "sync"] }

# For local work, put this in .cargo/config.toml (git-ignored) or uncomment it
# here and do not commit it. See the top-level README.
#
# [patch."https://github.com/dav-anderson/sp-wire.git"]
# sp-wire = { path = "../sp-wire" }
#
# [patch."https://github.com/dav-anderson/mint-core.git"]
# mint-core = { path = "../mint-core-v0.3.0/crates/mint-core" }
# mint-types = { path = "../mint-core-v0.3.0/crates/mint-types" }
# bdhke = { path = "../mint-core-v0.3.0/crypto/bdhke" }

# sp-wire's `air-client` builds air_server 1.0.1, which takes `air` 3.0.0 from
# crates.io. This points that at the AIR sp-wire pins (3.0.0 plus the `SecretKey`
# export), or two `air` crates are built and their types do not match. sp-wire has
# the same block, but a patch applies only in the crate being built.
[patch.crates-io]
air = { git = "https://github.com/ramp-stack/air", rev = "eae5133414fca493fa80ab3facf28248df9ad65d" }
