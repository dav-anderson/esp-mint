[package]
name = "esp-mint"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[dependencies]
mint-core = { git = "https://github.com/dav-anderson/mint-core", tag = "v0.1.2" }
mint-types = { git = "https://github.com/dav-anderson/mint-core", tag = "v0.1.2" }
bdhke = { git = "https://github.com/dav-anderson/mint-core", tag = "v0.1.2" }
mint-server = { git = "https://github.com/dav-anderson/mint-core", tag = "v0.1.2" }
secp256k1 = { version = "0.30", default-features = false, features = ["global-context", "rand", "serde"] }
sha2 = "0.10"
hex = "0.4.3"
rand = "0.8.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal"] }
